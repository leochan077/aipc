/* Layout: an arcade "level select" screen. One column of unit worlds; each lesson is a level card on a dashed path. Single dark look, like the lesson pages. */
:root{
  --bg:#120F33; --bg2:#1D1A52; --bg3:#2A2670; --line:#4B44A8; --edge:#0A0826;
  --ink:#F6F4FF; --mute:#BDB7EC; --dim:#8C85C9;
  --gold:#FFD23F; --red:#FF4D5E; --green:#3BE08F; --npu:#38BDF8; --gpu:#E879F9; --cpu:#FF9F43;
  --zh:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Noto Sans CJK TC",sans-serif;
  --pix:"Press Start 2P","Courier New",monospace;
  --lab:"Silkscreen","Press Start 2P","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--zh);
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
header{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:15px;font-weight:700;background:var(--bg3);border:3px solid var(--line);padding:4px 10px}
.pre{font-family:var(--pix);font-size:13px;color:var(--npu);margin:0 0 12px;letter-spacing:1px}
h1{font-size:clamp(34px,6vw,58px);font-weight:900;margin:0;line-height:1.12;text-shadow:5px 5px 0 #000;text-wrap:balance}
.lead{font-size:18px;color:var(--mute);margin:12px 0 0;line-height:1.55;max-width:60ch}
.mascot{width:150px;height:150px;image-rendering:pixelated}
.world{display:flex;flex-direction:column;gap:14px}
.world h2{margin:0;display:flex;align-items:center;gap:12px;font-size:24px;font-weight:900;text-wrap:balance}
.world h2 .w{font-family:var(--pix);font-size:12px;color:#1A1440;background:var(--gold);padding:7px 9px;box-shadow:3px 3px 0 #000;flex:none}
.world h2 .wd{font-size:16px;color:var(--mute);font-weight:700}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.lv{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--bg2);border:4px solid var(--line);box-shadow:6px 6px 0 #00000088;padding:16px 18px;min-width:0}
.lv.open{border-color:var(--npu)}
.lv.boss{border-color:var(--red)}
.lv .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lv .no{font-size:17px;font-weight:800;color:var(--mute);line-height:1.4}
.lv .no b{font-family:var(--pix);font-size:17px;color:var(--npu);margin:0 4px}
.lv.boss .no{font-family:var(--pix);font-size:15px}
#map{display:flex;flex-direction:column;gap:34px}
.lv.boss .no{color:var(--red)}
.pill{font-size:13px;font-weight:800;padding:3px 9px;border:3px solid;white-space:nowrap}
.pill.on{color:var(--green);border-color:var(--green)}
.pill.soon{color:var(--dim);border-color:var(--dim)}
.pill.boss{color:var(--red);border-color:var(--red)}
.lv h3{margin:0;font-size:24px;font-weight:900;line-height:1.3;text-wrap:balance}
.lv .meta{margin:0;font-size:15px;color:var(--mute);line-height:1.5}
.lv .topics{display:flex;flex-wrap:wrap;gap:6px}
.lv .topics span{font-size:14px;font-weight:700;padding:2px 8px;border:2px solid var(--line);background:#0C0A2A}
.lv .rec{margin:0;font-size:15px;font-weight:700;color:var(--gold);min-height:22px}
.lv .rec.none{color:var(--dim);font-weight:500}
.go{margin-top:auto;display:block;text-align:center;font-size:20px;font-weight:800;text-decoration:none;color:#1A1440;background:var(--gold);border:3px solid var(--gold);box-shadow:0 5px 0 var(--edge);padding:10px 14px;transition:transform .08s}
.go:hover{filter:brightness(1.08)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.go:focus-visible{outline:3px solid #fff;outline-offset:3px}
.go.off{background:none;color:var(--dim);border-color:var(--dim);box-shadow:none;cursor:default}
.lv.soon h3{color:var(--mute)}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tip{background:#0C0A2A;border:3px dashed var(--line);padding:12px 14px;font-size:16px;line-height:1.55;color:var(--mute)}
.tip b{color:var(--ink)}
.tip a{color:var(--npu);font-weight:700}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1s steps(1) infinite}
@media (max-width:640px){ header{grid-template-columns:1fr} .mascot{display:none} .lv h3{font-size:21px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 w10:()=>{ const w=get('u4.w10.who'); if(!w) return ''; const r=get(`u4.w10.${w.cls}.${w.no}`)||{}; const n=Object.keys(r.prac||{}).length; return `${w.cls}-${z2(w.no)} 在這部電腦：練習已答 ${n} / 25 題 · ${r.sub?'堂課已交卷 ✔':'堂課未交卷'}`; }
};
document.getElementById('map').innerHTML=WORLDS.map(W=>`<section class="world"><h2><span class="w">${esc(W.unit)}</span>${esc(W.name)}</h2><div class="levels">${W.lessons.map(L=>{
  if(L.boss) return `<article class="lv boss"><div class="top"><span class="no">BOSS</span><span class="pill boss">測驗</span></div><h3>${esc(L.title)}</h3><p class="meta">${esc(L.meta)}</p><div class="topics">${L.topics.map(t=>`<span>${esc(t)}</span>`).join('')}</div><p class="rec none">${esc(L.note||'')}</p></article>`;
  let rec=''; try{ rec=L.rec&&REC[L.rec]?REC[L.rec]():''; }catch(e){}
  return `<article class="lv ${L.open?'open':'soon'}"><div class="top"><span class="no">第<b>${L.no}</b>課</span><span class="pill ${L.open?'on':'soon'}">${L.open?'已開放':'即將開放'}</span></div><h3>${esc(L.title)}</h3><p class="meta">${esc(L.meta)}</p><div class="topics">${L.topics.map(t=>`<span>${esc(t)}</span>`).join('')}</div><p class="rec${rec?'':' none'}">${rec?esc(rec):(L.open?'這部電腦未有紀錄':'老師上課時開放')}</p>${L.open?`<a class="go" href="${esc(L.file)}">進入第 ${L.no} 課 ▶</a>`:'<span class="go off" aria-disabled="true">未開放</span>'}</article>`; }).join('')}</div></section>`).join('');
})();
</script>
