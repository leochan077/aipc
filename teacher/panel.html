const ulB=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ulDecrypt(pass){ const te=new TextEncoder(); const km=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ulB(UL_ENC.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ulB(UL_ENC.i)},key,ulB(UL_ENC.c)); return JSON.parse(new TextDecoder().decode(pt)); }
const ulGet=()=>{ try{ return sessionStorage.getItem(UL_KEY)||localStorage.getItem(UL_KEY)||''; }catch(e){ return ''; } };
const ulKept=()=>{ try{ return !!localStorage.getItem(UL_KEY); }catch(e){ return false; } };
const ulSave=(p,keep)=>{ try{ sessionStorage.setItem(UL_KEY,p); if(keep) localStorage.setItem(UL_KEY,p); else localStorage.removeItem(UL_KEY); }catch(e){} };
const ulForget=()=>{ try{ sessionStorage.removeItem(UL_KEY); localStorage.removeItem(UL_KEY); }catch(e){} };
const ulToast=m=>{ if(typeof toast==='function') toast(m); };

  <input type="password" id="ulPw" autocomplete="off" aria-label="老師解鎖密碼">

</div></div>`);
(function(){ const btn='<button id="ulBtn" title="老師解鎖">🔒 解鎖</button>'; const hl=document.querySelector('.hud-l'), slot=document.querySelector('#ulSlot');
  if(hl){ if(!document.querySelector('#hudHome')) hl.insertAdjacentHTML('afterbegin','<a id="hudHome" href="./" title="老師版主頁">⌂ 主頁</a>'); document.querySelector('#hudHome').insertAdjacentHTML('afterend',btn); }
  else if(slot) slot.innerHTML=btn; else document.body.insertAdjacentHTML('afterbegin',btn); })();
let UNLOCKED=false;
async function ulTry(p,keep,silent){ try{ const d=await ulDecrypt(p); ulSave(p,keep); UNLOCKED=true; const b=$('#ulBtn'); b.textContent='🔓 已解鎖'; b.classList.add('on'); UNLOCK_APPLY(d); if(!silent) ulToast('已解鎖：顯示備註和答案'); return true; }catch(e){ return false; } }
function ulOpen(){ $('#ulErr').textContent=''; $('#ulPw').value=''; $('#ulKeep').checked=ulKept(); $('#ulLock').hidden=!UNLOCKED; $('#ulPw').hidden=$('#ulGo').hidden=UNLOCKED; $('#ulKeep').parentElement.hidden=UNLOCKED;
  $('#ulMsg').textContent=UNLOCKED?'已解鎖。要鎖上的話，按「鎖上並忘記密碼」，頁面會重新載入。':'網上版的備註和答案已加密。輸入老師解鎖密碼後才會顯示。'; $('#ulM').hidden=false; if(!UNLOCKED) setTimeout(()=>$('#ulPw').focus(),40); }
$('#ulBtn').addEventListener('click',ulOpen);
$('#ulClose').addEventListener('click',()=>$('#ulM').hidden=true);
$('#ulLock').addEventListener('click',()=>{ ulForget(); location.reload(); });
$('#ulGo').addEventListener('click',async()=>{ const p=$('#ulPw').value; if(!p){ $('#ulErr').textContent='請輸入密碼'; return; } $('#ulErr').textContent='解鎖中…';
  if(await ulTry(p,$('#ulKeep').checked)){ $('#ulM').hidden=true; } else $('#ulErr').textContent='密碼不正確'; });
$('#ulPw').addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Enter') $('#ulGo').click(); if(e.key==='Escape') $('#ulM').hidden=true; });
(function(){ const p=ulGet(); if(p) ulTry(p,ulKept(),true); })();

render(); load();
})();
